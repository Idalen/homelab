services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # Docker inside LXC cannot load its own AppArmor profiles.
    security_opt:
      - apparmor=unconfined
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: America/Sao_Paulo
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ${CONFIG_DIR}:/config
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
