- name: Install and configure Vaultwarden password manager
  hosts: all
  become: yes
  collections:
    - community.general
    - community.docker

  vars:
    vaultwarden_user: "vaultwarden"
    vaultwarden_group: "vaultwarden"
    vaultwarden_uid: 1002
    vaultwarden_gid: 1002
    vaultwarden_home: "/var/lib/vaultwarden"
    vaultwarden_data_dir: "{{ vaultwarden_home }}/data"
    vaultwarden_log_dir: "/var/log/vaultwarden"
    vaultwarden_version: "1.32.0"
    vaultwarden_port: "8000"
    vaultwarden_domain: "vaultwarden.home.arpa"
    dns_servers:
      - "192.168.0.2"
      - "1.1.1.1"
    # Sensitive variables loaded from environment
    admin_token: "{{ lookup('env', 'VAULTWARDEN_ADMIN_TOKEN', default='') }}"
    signups_allowed: "false"
    invitations_allowed: "true"
    smtp_enabled: "false"

  tasks:
    - name: Validate admin token
      ansible.builtin.fail:
        msg: "VAULTWARDEN_ADMIN_TOKEN must be set in environment"
      when: admin_token | length == 0

    - name: Disable systemd-resolved if enabled
      shell: systemctl disable --now systemd-resolved
      register: resolved_disable
      failed_when: false
      changed_when: resolved_disable.rc == 0

    - name: Set resolv.conf for installer
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ dns_servers[0] }}
          nameserver {{ dns_servers[1] }}
        mode: '0644'

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install system dependencies
      apt:
        name:
          - curl
          - wget
          - gnupg
          - ca-certificates
          - sqlite3
          - libssl-dev
          - pkg-config
        state: present

    - name: Install Python dependencies for Docker module
      apt:
        name:
          - python3-requests
          - python3-docker
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Enable and start Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create vaultwarden group
      group:
        name: "{{ vaultwarden_group }}"
        gid: "{{ vaultwarden_gid }}"
        state: present

    - name: Create vaultwarden user
      user:
        name: "{{ vaultwarden_user }}"
        uid: "{{ vaultwarden_uid }}"
        group: "{{ vaultwarden_group }}"
        home: "{{ vaultwarden_home }}"
        shell: /usr/sbin/nologin
        system: yes
        create_home: yes

    - name: Create Vaultwarden directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ vaultwarden_user }}"
        group: "{{ vaultwarden_group }}"
        mode: '0750'
      loop:
        - "{{ vaultwarden_home }}"
        - "{{ vaultwarden_data_dir }}"
        - "{{ vaultwarden_log_dir }}"
        - /etc/vaultwarden

    - name: Pull Vaultwarden Docker image
      docker_image:
        name: vaultwarden/server
        tag: "{{ vaultwarden_version }}"
        source: pull

    - name: Create environment file
      copy:
        dest: /etc/vaultwarden/environment
        content: |
          # Database
          DATABASE_URL=/data/db.sqlite3
          
          # Web server
          ROCKET_ADDRESS=0.0.0.0
          ROCKET_PORT={{ vaultwarden_port }}
          ROCKET_LOG=critical
          
          # Security
          ADMIN_TOKEN={{ admin_token }}
          SIGNUPS_ALLOWED={{ signups_allowed }}
          INVITATIONS_ALLOWED={{ invitations_allowed }}
          
          # Domain
          DOMAIN=https://{{ vaultwarden_domain }}
          
          # SMTP (disabled by default)
          SMTP_HOST=
          SMTP_FROM=
          SMTP_USERNAME=
          SMTP_PASSWORD=
          SMTP_PORT=587
          SMTP_SSL=true
          
          # Other settings
          LOG_LEVEL=warn
          EXTENDED_LOGGING=false
          SHOW_PASSWORD_HINT=false
        mode: '0640'
        owner: root
        group: "{{ vaultwarden_group }}"

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/vaultwarden.service
        content: |
          [Unit]
          Description=Vaultwarden password manager
          After=docker.service
          Requires=docker.service
          
          [Service]
          Type=simple
          ExecStart=/usr/bin/docker run --rm --name vaultwarden \
            --env-file /etc/vaultwarden/environment \
            -v {{ vaultwarden_data_dir }}:/data \
            -p {{ vaultwarden_port }}:{{ vaultwarden_port }} \
            -u "{{ vaultwarden_uid }}:{{ vaultwarden_gid }}" \
            vaultwarden/server:{{ vaultwarden_version }}
          ExecStop=/usr/bin/docker stop vaultwarden
          ExecStopPost=/usr/bin/docker rm -f vaultwarden
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=vaultwarden
          
          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start Vaultwarden service
      systemd:
        name: vaultwarden
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Wait for Vaultwarden to be ready
      wait_for:
        port: "{{ vaultwarden_port }}"
        delay: 2
        timeout: 30

    - name: Show admin access information
      debug:
        msg: |
          Vaultwarden installed successfully!
          Access URL: https://{{ vaultwarden_domain }}
          Admin token: {{ admin_token }}
          Service status: systemctl status vaultwarden
          Logs: journalctl -u vaultwarden -f