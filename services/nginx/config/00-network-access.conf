# Classify clients and the local address that accepted the connection.
geo $remote_addr $client_network {
  default external;
  192.168.0.0/24 lan;
  2804:14c:47:2b95::/64 lan;
  100.64.0.0/10 tailscale;
  fd7a:115c:a1e0::/48 tailscale;
}

geo $server_addr $listener_network {
  default external;
  192.168.0.3/32 lan;
  2804:14c:47:2b95::3/128 lan;
  100.64.0.0/10 tailscale;
  fd7a:115c:a1e0::/48 tailscale;
}

map "$client_network:$listener_network" $lan_access_allowed {
  default 0;
  "lan:lan" 1;
}

map "$client_network:$listener_network" $tailscale_access_allowed {
  default 0;
  "tailscale:tailscale" 1;
}
