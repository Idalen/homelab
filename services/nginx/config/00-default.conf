server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;

  include /etc/nginx/snippets/allowed-origins.conf;

  ssl_certificate /etc/nginx/certs/home-arpa.crt;
  ssl_certificate_key /etc/nginx/certs/home-arpa.key;

  # Run access checks before returning 404 for allowed clients.
  root /etc/nginx/empty;
  location / {
    try_files $uri =404;
  }
}
