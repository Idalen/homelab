services:
  pds:
    image: ghcr.io/bluesky-social/pds:0.4
    container_name: pds
    restart: unless-stopped
    # Docker inside LXC cannot load its own AppArmor profiles.
    security_opt:
      - apparmor=unconfined
    env_file:
      - ./secrets.env
      - ./pds.env
    ports:
      - "3000:3000"
    volumes:
      - /pds:/pds
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
