---
- name: Install and configure Ladder
  hosts: ladder
  become: true

  vars_files:
    - ../../../shared/network.yml

  vars:
    ladder_dir: /srv/ladder
    docker_arch: amd64

  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Remove legacy Docker APT repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: Configure Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris: https://download.docker.com/linux/ubuntu
        suites:
          - "{{ ansible_distribution_release }}"
        components:
          - stable
        architectures:
          - "{{ docker_arch }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present
        enabled: true

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        # Refresh after adding Docker's repository, including on retries.
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Create Ladder directory
      ansible.builtin.file:
        path: "{{ ladder_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Ladder configuration
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ladder_dir }}/{{ item | basename }}"
        mode: "0644"
      loop:
        - ../config/docker-compose.yml
        - ../config/rules.yaml
      register: ladder_configuration

    - name: Deploy Ladder environment
      ansible.builtin.copy:
        content: |
          FLARESOLVERR_HOST=http://{{ ips.flaresolverr }}:8191
        dest: "{{ ladder_dir }}/.env"
        mode: "0644"

    - name: Verify FlareSolverr is reachable from Ladder
      ansible.builtin.uri:
        url: "http://{{ ips.flaresolverr }}:8191/"
        status_code: 200
      register: flaresolverr_health
      until: flaresolverr_health.status | default(0) == 200
      retries: 15
      delay: 2
      when: not ansible_check_mode

    - name: Ensure Ladder is running
      community.docker.docker_compose_v2:
        project_src: "{{ ladder_dir }}"
        state: present
        build: always
        pull: never
        recreate: "{{ 'always' if ladder_configuration.changed else 'auto' }}"
        remove_orphans: true
