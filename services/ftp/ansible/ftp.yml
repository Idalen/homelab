- name: Install and configure FTP server (vsftpd)
  hosts: all
  become: yes
  collections:
    - community.general

  vars:
    ftp_user: "ftpuser"
    ftp_password: "{{ lookup('env', 'FTP_PASSWORD', default='') }}"
    ftp_home: "/srv/ftp"
    ftp_port: "21"
    passive_ports_min: "50000"
    passive_ports_max: "50100"
    enable_ssl: false

  tasks:
    - name: Disable systemd-resolved if enabled
      shell: systemctl disable --now systemd-resolved
      register: resolved_disable
      failed_when: false
      changed_when: resolved_disable.rc == 0

    - name: Set resolv.conf for installer
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 192.168.0.2
          nameserver 1.1.1.1
        mode: '0644'

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install vsftpd
      apt:
        name: vsftpd
        state: present

    - name: Ensure nologin shell is allowed
      lineinfile:
        path: /etc/shells
        line: '/usr/sbin/nologin'
        create: yes
        state: present

    - name: Create FTP user
      user:
        name: "{{ ftp_user }}"
        password: "{{ ftp_password | password_hash('sha512') }}"
        shell: /usr/sbin/nologin
        home: "{{ ftp_home }}"
        create_home: yes
        system: yes
      when: ftp_password | length > 0

    - name: Create FTP home directory
      file:
        path: "{{ ftp_home }}"
        state: directory
        owner: root
        group: "{{ ftp_user }}"
        mode: '0755'

    - name: Ensure upload directory exists
      file:
        path: "{{ ftp_home }}/upload"
        state: directory
        owner: "{{ ftp_user }}"
        group: "{{ ftp_user }}"
        mode: '0755'

    - name: Configure vsftpd
      copy:
        dest: /etc/vsftpd.conf
        content: |
          # Basic configuration
          listen=YES
          listen_ipv6=NO
          anonymous_enable=NO
          local_enable=YES
          write_enable=YES
          local_umask=022
          dirmessage_enable=YES
          use_localtime=YES
          xferlog_enable=YES
          connect_from_port_20=YES
          secure_chroot_dir=/var/run/vsftpd/empty
          pam_service_name=vsftpd
          rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
          rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          ssl_enable={{ 'YES' if enable_ssl else 'NO' }}

          # Passive mode configuration
          pasv_enable=YES
          pasv_min_port={{ passive_ports_min }}
          pasv_max_port={{ passive_ports_max }}
          pasv_address=192.168.0.5

          # Restrict users to their home directory
          chroot_local_user=YES
          allow_writeable_chroot=YES

          # Logging
          xferlog_file=/var/log/vsftpd.log
          xferlog_std_format=YES
        mode: '0644'

    - name: Ensure vsftpd service is started and enabled
      systemd:
        name: vsftpd
        state: started
        enabled: yes


