---
- name: Determine blocklist drift
  ansible.builtin.set_fact:
    pihole_matching_lists: "{{ pihole_existing_lists.json.lists | selectattr('address', 'equalto', pihole_adlist.url) | list }}"
    pihole_list_body:
      comment: "{{ pihole_adlist.comment | default('') }}"
      enabled: "{{ pihole_adlist.enabled | default(true) | bool }}"
      groups: "{{ pihole_adlist.groups | default([0]) }}"

- name: Compare declared blocklist properties
  ansible.builtin.set_fact:
    pihole_list_changed: >-
      {{ pihole_matching_lists | length == 0 or
         pihole_matching_lists[0].comment != pihole_list_body.comment or
         pihole_matching_lists[0].enabled != pihole_list_body.enabled or
         (pihole_matching_lists[0].groups | sort) != (pihole_list_body.groups | sort) }}

- name: Report blocklist changes in check mode
  ansible.builtin.debug:
    msg: "Would reconcile {{ pihole_adlist.url }}"
  when: ansible_check_mode and pihole_list_changed
  changed_when: true

- name: Add missing or update changed blocklist
  ansible.builtin.uri:
    url: >-
      {{ pihole_api_url }}/lists{{ ('/' ~ (pihole_adlist.url | urlencode | replace('/', '%2F')))
         if pihole_matching_lists | length > 0 else '' }}?type=block
    method: "{{ 'PUT' if pihole_matching_lists | length > 0 else 'POST' }}"
    headers: "{{ pihole_api_headers }}"
    body_format: json
    body: "{{ pihole_list_body if pihole_matching_lists | length > 0 else pihole_list_body | combine({'address': pihole_adlist.url}) }}"
    status_code: [200, 201]
  when: pihole_list_changed and not ansible_check_mode
  changed_when: true
  notify: Update gravity
