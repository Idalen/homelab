---
- name: Configure mautrix-whatsapp for Continuwuity
  hosts: matrix
  become: true
  gather_facts: false
  tags: [deploy, whatsapp]

  vars:
    matrix_dir: /opt/continuwuity
    whatsapp_dir: "{{ matrix_dir }}/whatsapp"
    whatsapp_dotenv: >-
      {{ dict((lookup('ansible.builtin.file', playbook_dir ~ '/../../../.env', errors='ignore')
         | default('', true))
         | regex_findall('(?m)^(?:export[ \t]+)?(WHATSAPP_BRIDGE_ADMIN)[ \t]*=[ \t]*([^\r\n]*)$')) }}
    whatsapp_admin: >-
      {{ lookup('ansible.builtin.env', 'WHATSAPP_BRIDGE_ADMIN')
         | default(whatsapp_dotenv.get('WHATSAPP_BRIDGE_ADMIN', '') | trim | trim("'\""), true)
         | default('@vieira:' ~ whatsapp_server_name, true) }}

  tasks:
    - name: Read the deployed Matrix environment
      ansible.builtin.slurp:
        src: "{{ matrix_dir }}/.env"
      register: whatsapp_matrix_environment
      no_log: true

    - name: Read the Matrix server identity
      ansible.builtin.set_fact:
        whatsapp_server_name: >-
          {{ ((whatsapp_matrix_environment.content | b64decode)
              | regex_findall('(?m)^MATRIX_SERVER_NAME=(.*)$') | first) }}
        whatsapp_homeserver_ip: >-
          {{ ((whatsapp_matrix_environment.content | b64decode)
              | regex_findall('(?m)^MATRIX_IPV4=(.*)$') | first) }}

    - name: Validate the bridge administrator
      ansible.builtin.assert:
        that:
          - whatsapp_admin is match('^@[^:]+:' ~ (whatsapp_server_name | regex_escape) ~ '$')
        fail_msg: WHATSAPP_BRIDGE_ADMIN must be a full Matrix user ID on this homeserver.

    - name: Create the private bridge data directory
      ansible.builtin.file:
        path: "{{ whatsapp_dir }}"
        state: directory
        mode: "0700"

    - name: Generate the bridge's version-matched default configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - run
          - --rm
          - --no-deps
          - --entrypoint
          - /usr/bin/mautrix-whatsapp
          - whatsapp
          - -e
          - -c
          - /data/config.yaml
        chdir: "{{ matrix_dir }}"
        creates: "{{ whatsapp_dir }}/config.yaml"
      no_log: true

    - name: Read the bridge configuration, preserving existing tokens and keys
      ansible.builtin.slurp:
        src: "{{ whatsapp_dir }}/config.yaml"
      register: whatsapp_existing_config
      no_log: true

    - name: Build the desired bridge configuration
      ansible.builtin.set_fact:
        whatsapp_desired_config: >-
          {{ (whatsapp_existing_config.content | b64decode | from_yaml)
             | combine(whatsapp_managed_config, recursive=true)
             | combine({'bridge': ((whatsapp_existing_config.content | b64decode | from_yaml).bridge
                 | combine({'permissions': {whatsapp_admin: 'admin'}})),
                 'double_puppet': {'servers': {}, 'secrets': {}, 'allow_discovery': false}}, recursive=false)
             }}
      vars:
        whatsapp_managed_config:
          homeserver:
            address: "http://{{ whatsapp_homeserver_ip }}:8008"
            domain: "{{ whatsapp_server_name }}"
            software: standard
          appservice:
            address: http://127.0.0.1:29318
            hostname: 127.0.0.1
            port: 29318
            id: whatsapp
            bot:
              username: whatsappbot
          database:
            type: sqlite3-fk-wal
            uri: file:/data/whatsapp.db?_txlock=immediate
            max_open_conns: 1
            max_idle_conns: 1
          matrix:
            federate_rooms: false
          provisioning:
            shared_secret: disable
          encryption:
            allow: true
            default: true
            appservice: false
      no_log: true

    - name: Update bridge configuration only when its settings change
      ansible.builtin.copy:
        content: "{{ whatsapp_desired_config | to_nice_yaml(indent=4, width=120) }}"
        dest: "{{ whatsapp_dir }}/config.yaml"
        mode: "0600"
      when: (whatsapp_existing_config.content | b64decode | from_yaml) != whatsapp_desired_config
      register: whatsapp_config_deployment
      no_log: true

    - name: Protect the bridge configuration
      ansible.builtin.file:
        path: "{{ whatsapp_dir }}/config.yaml"
        mode: "0600"

    - name: Generate the appservice registration once
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - run
          - --rm
          - --no-deps
          - --entrypoint
          - /usr/bin/mautrix-whatsapp
          - whatsapp
          - -g
          - -c
          - /data/config.yaml
          - -r
          - /data/registration.yaml
        chdir: "{{ matrix_dir }}"
        creates: "{{ whatsapp_dir }}/registration.yaml"
      no_log: true

    - name: Use escape-free literal dots in the generated registration
      ansible.builtin.replace:
        path: "{{ whatsapp_dir }}/registration.yaml"
        regexp: '\\+\.'
        replace: '[.]'
      no_log: true

    - name: Protect the appservice registration
      ansible.builtin.file:
        path: "{{ whatsapp_dir }}/registration.yaml"
        mode: "0600"

    - name: Read the generated appservice registration
      ansible.builtin.slurp:
        src: "{{ whatsapp_dir }}/registration.yaml"
      register: whatsapp_registration
      no_log: true

    - name: Check the appservice token and bot namespace
      ansible.builtin.uri:
        url: "http://{{ whatsapp_homeserver_ip }}:8008/_matrix/client/versions?user_id={{ ('@whatsappbot:' ~ whatsapp_server_name) | urlencode }}"
        headers:
          Authorization: "Bearer {{ (whatsapp_registration.content | b64decode | from_yaml).as_token }}"
        status_code: [200, 400, 401]
        return_content: true
      register: whatsapp_registration_check
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Start the WhatsApp bridge
      community.docker.docker_compose_v2:
        project_src: "{{ matrix_dir }}"
        services: [whatsapp]
        state: present
        pull: missing
        recreate: "{{ 'always' if whatsapp_config_deployment.changed | default(false) else 'auto' }}"

    - name: Explain a registered appservice with an invalid bot namespace
      ansible.builtin.debug:
        msg:
          - "Continuwuity accepts the token but rejects the bot namespace."
          - "In the private admin room, send !admin appservices unregister whatsapp, then register the exact YAML below again."
          - "Preserve regex backslashes exactly; do not paste JSON-escaped output as YAML."
          - "To display the raw YAML, run: cat {{ whatsapp_dir }}/registration.yaml on the Matrix host."
      when:
        - not ansible_check_mode
        - whatsapp_registration_check.status == 400
        - whatsapp_registration_check.json.errcode | default('') == 'M_EXCLUSIVE'

    # Intentionally display the registration for the owner's internal deployment.
    - name: Show the command to paste in the private Continuwuity admin room
      ansible.builtin.debug:
        msg: |
          !admin appservices register
          ```yaml
          {{ whatsapp_registration.content | b64decode | trim }}
          ```
      when:
        - not ansible_check_mode
        - whatsapp_registration_check.status != 200

    - name: Show the one-time registration and login steps
      ansible.builtin.debug:
        msg:
          - "Once: paste the command above into your private Continuwuity admin room."
          - "Confirm with !admin appservices list. The bridge retries startup until registration succeeds."
          - "Then open a private chat with @whatsappbot:{{ whatsapp_server_name }} and send login qr."
          - "Link it from WhatsApp on your phone under Linked devices."
      when:
        - not ansible_check_mode
        - whatsapp_registration_check.status != 200

    - name: Report an already registered bridge
      ansible.builtin.debug:
        msg: "The WhatsApp appservice is already registered. Existing credentials and WhatsApp session are preserved."
      when:
        - not ansible_check_mode
        - whatsapp_registration_check.status == 200
