---
- name: Install and configure Continuwuity
  hosts: matrix
  become: true
  gather_facts: false

  vars_files:
    - ../../../shared/network.yml

  vars:
    matrix_dir: /opt/continuwuity
    matrix_server_name: "{{ lookup('ansible.builtin.env', 'MATRIX_SERVER_NAME') | default('quati.xyz', true) }}"

  tasks:
    - name: Prepare the Continuwuity host
      tags: [prepare]
      block:
        - name: Install Docker and Compose
          ansible.builtin.apt:
            name:
              - ca-certificates
              - docker.io
              - docker-compose-v2
            state: present
            update_cache: true
            cache_valid_time: 3600
            lock_timeout: 300

        - name: Enable Docker
          ansible.builtin.systemd_service:
            name: docker
            state: started
            enabled: true

        - name: Create the Continuwuity directory
          ansible.builtin.file:
            path: "{{ matrix_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

    - name: Configure and start Continuwuity
      tags: [deploy]
      block:
        - name: Check for an existing environment
          ansible.builtin.stat:
            path: "{{ matrix_dir }}/.env"
          register: matrix_env

        - name: Read the existing environment
          ansible.builtin.slurp:
            src: "{{ matrix_dir }}/.env"
          register: matrix_existing_env
          when: matrix_env.stat.exists
          no_log: true

        - name: Read the existing server identity
          ansible.builtin.set_fact:
            matrix_existing_server_name: >-
              {{ ((matrix_existing_env.content | default('') | b64decode)
                  | regex_findall('(?m)^MATRIX_SERVER_NAME=(.*)$') | first) | default('') }}

        - name: Select the permanent server identity
          ansible.builtin.set_fact:
            matrix_effective_server_name: >-
              {{ matrix_server_name if matrix_server_name | length > 0 else matrix_existing_server_name }}

        - name: Require a domain and preserve the existing server identity
          ansible.builtin.assert:
            that:
              - matrix_effective_server_name is match('^(?=.{1,253}$)([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
              - matrix_existing_server_name == '' or matrix_existing_server_name == matrix_effective_server_name
            fail_msg: >-
              Set MATRIX_SERVER_NAME to your permanent Matrix domain, or pass
              -e matrix_server_name=chat.example.com. An existing server identity
              cannot be changed by this playbook.

        - name: Read the existing registration token
          ansible.builtin.set_fact:
            matrix_registration_token: >-
              {{ ((matrix_existing_env.content | default('') | b64decode)
                  | regex_findall('(?m)^MATRIX_REGISTRATION_TOKEN=(.*)$') | first) | default('') }}
          no_log: true

        - name: Generate a registration token when missing
          ansible.builtin.set_fact:
            matrix_registration_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits']) }}"
          when: matrix_registration_token | length == 0
          no_log: true

        - name: Deploy the Compose configuration
          ansible.builtin.copy:
            src: ../config/docker-compose.yml
            dest: "{{ matrix_dir }}/docker-compose.yml"
            owner: root
            group: root
            mode: "0644"

        - name: Deploy the environment
          ansible.builtin.copy:
            content: |
              MATRIX_SERVER_NAME={{ matrix_effective_server_name }}
              MATRIX_IPV4={{ ips.matrix }}
              MATRIX_REGISTRATION_TOKEN={{ matrix_registration_token }}
            dest: "{{ matrix_dir }}/.env"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Start Continuwuity
          community.docker.docker_compose_v2:
            project_src: "{{ matrix_dir }}"
            state: present
            pull: missing
            recreate: auto

        - name: Wait for the Matrix client API
          ansible.builtin.uri:
            url: "http://{{ ips.matrix }}:8008/_matrix/client/versions"
            status_code: 200
          register: matrix_health
          until: matrix_health.status | default(0) == 200
          retries: 30
          delay: 2
          when: not ansible_check_mode

        - name: Check the configured registration token
          ansible.builtin.uri:
            url: "http://{{ ips.matrix }}:8008/_matrix/client/v1/register/m.login.registration_token/validity?token={{ matrix_registration_token | urlencode }}"
            return_content: true
          register: matrix_token_validity
          no_log: true
          when: not ansible_check_mode

        - name: Read the initial setup token when the configured token is not active
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import re, subprocess
                logs = subprocess.check_output(
                    ['docker', 'logs', '--tail', '2000', 'continuwuity'],
                    stderr=subprocess.STDOUT, text=True)
                logs = re.sub(chr(27) + r'\[[0-9;]*m', '', logs)
                tokens = re.findall(r'using the registration token ([A-Za-z0-9]+)', logs)
                if not tokens:
                    raise SystemExit('Initial setup token not found in container logs')
                print(tokens[-1])
          register: matrix_initial_token
          changed_when: false
          no_log: true
          when:
            - not ansible_check_mode
            - not (matrix_token_validity.json.valid | default(false))

        - name: Select the active registration token
          ansible.builtin.set_fact:
            matrix_active_registration_token: >-
              {{ matrix_registration_token if matrix_token_validity.json.valid
                 else matrix_initial_token.stdout | trim }}
          no_log: true
          when: not ansible_check_mode

        - name: Verify the selected registration token
          ansible.builtin.uri:
            url: "http://{{ ips.matrix }}:8008/_matrix/client/v1/register/m.login.registration_token/validity?token={{ matrix_active_registration_token | urlencode }}"
            return_content: true
          register: matrix_active_token_validity
          failed_when: not (matrix_active_token_validity.json.valid | default(false))
          no_log: true
          when: not ansible_check_mode

        - name: Show the active registration token
          ansible.builtin.debug:
            msg: >-
              {{ 'Matrix registration token' if matrix_token_validity.json.valid
                 else 'Matrix initial setup token (create the first account)' }}:
              {{ matrix_active_registration_token }}
          when: not ansible_check_mode

- name: Configure the WhatsApp bridge
  ansible.builtin.import_playbook: whatsapp.yml

- name: Configure the Telegram bridge
  ansible.builtin.import_playbook: telegram.yml
