---
- name: Install and configure BookOrbit
  hosts: all
  become: yes
  collections:
    - community.general

  vars:
    bookorbit_config_src: "{{ playbook_dir }}/../config"
    bookorbit_dir: /opt/bookorbit
    bookorbit_books_dir: "{{ bookorbit_dir }}/books"
    bookorbit_data_dir: "{{ bookorbit_dir }}/data"
    bookorbit_postgres_dir: "{{ bookorbit_dir }}/postgres-data"

  tasks:
    - name: Disable systemd-resolved if enabled
      shell: systemctl disable --now systemd-resolved
      register: resolved_disable
      failed_when: false
      changed_when: resolved_disable.rc == 0

    - name: Set resolv.conf for installer
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 1.1.1.1
          nameserver 1.0.0.1
        mode: '0644'

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Create BookOrbit directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "1000"
        group: "1000"
      loop:
        - "{{ bookorbit_books_dir }}"
        - "{{ bookorbit_data_dir }}"
        - "{{ bookorbit_postgres_dir }}"

    - name: Deploy docker-compose.yml
      copy:
        src: "{{ bookorbit_config_src }}/docker-compose.yml"
        dest: "{{ bookorbit_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Generate Postgres password
      shell: openssl rand -hex 24
      register: pg_password
      changed_when: false

    - name: Generate JWT secret
      shell: openssl rand -hex 32
      register: jwt_secret
      changed_when: false

    - name: Generate bootstrap token
      shell: openssl rand -hex 16
      register: bootstrap_token
      changed_when: false

    - name: Create BookOrbit .env file
      copy:
        dest: "{{ bookorbit_dir }}/.env"
        content: |
          APP_URL=http://192.168.0.7:3000
          POSTGRES_PASSWORD={{ pg_password.stdout }}
          POSTGRES_USER=bookorbit
          POSTGRES_DB=bookorbit
          JWT_SECRET={{ jwt_secret.stdout }}
          SETUP_BOOTSTRAP_TOKEN={{ bootstrap_token.stdout }}
          PUID=1000
          PGID=1000
          LOG_LEVEL=info
        mode: '0600'

    - name: Pull and start BookOrbit stack
      command: docker compose -f {{ bookorbit_dir }}/docker-compose.yml up -d
      args:
        chdir: "{{ bookorbit_dir }}"
      changed_when: false

    - name: Save bootstrap token for display
      debug:
        msg: "BookOrbit setup bootstrap token: {{ bootstrap_token.stdout }}"
