version: "3.8"

services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit-app
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "3000:3000"
    environment:
      - APP_URL=${APP_URL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-bookorbit}
      - POSTGRES_DB=${POSTGRES_DB:-bookorbit}
      - JWT_SECRET=${JWT_SECRET}
      - SETUP_BOOTSTRAP_TOKEN=${SETUP_BOOTSTRAP_TOKEN}
      - DATABASE_URL=postgres://${POSTGRES_USER:-bookorbit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bookorbit}
      - BOOKS_HOST_PATH=/books
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - /opt/bookorbit/books:/books
      - /opt/bookorbit/data:/data
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg18
    container_name: bookorbit-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-bookorbit}
      - POSTGRES_DB=${POSTGRES_DB:-bookorbit}
    volumes:
      - /opt/bookorbit/postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookorbit} -d ${POSTGRES_DB:-bookorbit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
