---
- name: Install and configure Navidrome
  hosts: navidrome
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for the Navidrome host to accept connections
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 300
      when: not ansible_check_mode

    - name: Gather host facts
      ansible.builtin.setup:

  vars:
    navidrome_dir: /opt/navidrome
    navidrome_uid: 1000
    navidrome_gid: 1000
    navidrome_storage_dir: /mnt/storage
    navidrome_data_dir: "{{ navidrome_storage_dir }}/appdata/navidrome"
    navidrome_music_dir: "{{ navidrome_storage_dir }}/downloads/music"
    docker_arch: amd64

  tasks:
    - name: Verify shared storage is mounted before writing data
      ansible.builtin.command:
        argv: [mountpoint, --quiet, "{{ navidrome_storage_dir }}"]
      changed_when: false
      check_mode: false

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
          - python3-requests
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Remove legacy Docker APT repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: Configure Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        architectures: ["{{ docker_arch }}"]
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present
        enabled: true

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        # Refresh after adding Docker's repository, including on retries.
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Create Navidrome project directory
      ansible.builtin.file:
        path: "{{ navidrome_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create persistent Navidrome data
      ansible.builtin.file:
        path: "{{ navidrome_data_dir }}"
        state: directory
        owner: "{{ navidrome_uid }}"
        group: "{{ navidrome_gid }}"
        mode: "0700"

    - name: Ensure the music directory exists
      ansible.builtin.file:
        path: "{{ navidrome_music_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Docker Compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/docker-compose.yml"
        dest: "{{ navidrome_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy Navidrome environment
      ansible.builtin.copy:
        content: |
          PUID={{ navidrome_uid }}
          PGID={{ navidrome_gid }}
          DATA_DIR={{ navidrome_data_dir }}
          MUSIC_DIR={{ navidrome_music_dir }}
        dest: "{{ navidrome_dir }}/.env"
        owner: root
        group: root
        mode: "0644"

    - name: Ensure Navidrome is running
      community.docker.docker_compose_v2:
        project_src: "{{ navidrome_dir }}"
        state: present
        pull: missing
        recreate: auto
        remove_orphans: true

    - name: Wait for the Navidrome GUI to respond
      ansible.builtin.uri:
        url: http://127.0.0.1:4533/ping
        status_code: 200
      register: navidrome_health
      until: navidrome_health.status | default(0) == 200
      retries: 60
      delay: 2
      when: not ansible_check_mode

    - name: Show how to access Navidrome
      ansible.builtin.debug:
        msg: "Open http://{{ ansible_host }}:4533 to create the administrator account. Music is read from {{ navidrome_music_dir }}."
